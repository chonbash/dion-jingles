<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Генератор иконок для Dion Jingles</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f5f5f5;
    }
    .icon-container {
      display: inline-block;
      margin: 10px;
      text-align: center;
    }
    canvas {
      border: 1px solid #ddd;
      background: white;
    }
    .instructions {
      background: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="instructions">
    <h2>Генератор иконок для Dion Jingles</h2>
    <p>Правой кнопкой мыши нажмите на каждую иконку и выберите "Сохранить изображение как..."</p>
    <p>Сохраните как: icon16.png, icon48.png, icon128.png в папку icons/</p>
  </div>

  <div class="icon-container">
    <canvas id="icon16" width="16" height="16"></canvas>
    <p>16x16</p>
  </div>

  <div class="icon-container">
    <canvas id="icon48" width="48" height="48"></canvas>
    <p>48x48</p>
  </div>

  <div class="icon-container">
    <canvas id="icon128" width="128" height="128"></canvas>
    <p>128x128</p>
  </div>

  <script>
    function drawIcon(canvas, size) {
      const ctx = canvas.getContext('2d');
      
      // Градиентный фон
      const gradient = ctx.createLinearGradient(0, 0, size, size);
      gradient.addColorStop(0, '#667eea');
      gradient.addColorStop(1, '#764ba2');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      
      // Рисуем ноту
      ctx.fillStyle = 'white';
      ctx.strokeStyle = 'white';
      ctx.lineWidth = size / 16;
      
      // Нотный знак
      const centerX = size / 2;
      const centerY = size / 2;
      const radius = size / 4;
      
      // Круг (голова ноты)
      ctx.beginPath();
      ctx.arc(centerX - radius/2, centerY - radius/2, radius * 0.6, 0, Math.PI * 2);
      ctx.fill();
      
      // Стебель
      ctx.beginPath();
      ctx.moveTo(centerX + radius/2, centerY - radius);
      ctx.lineTo(centerX + radius/2, centerY + radius * 1.5);
      ctx.stroke();
      
      // Флаг
      if (size >= 48) {
        ctx.beginPath();
        ctx.moveTo(centerX + radius/2, centerY - radius);
        ctx.lineTo(centerX + radius * 1.2, centerY - radius * 0.5);
        ctx.lineTo(centerX + radius/2, centerY - radius * 0.3);
        ctx.closePath();
        ctx.fill();
      }
    }

    drawIcon(document.getElementById('icon16'), 16);
    drawIcon(document.getElementById('icon48'), 48);
    drawIcon(document.getElementById('icon128'), 128);
  </script>
</body>
</html>
