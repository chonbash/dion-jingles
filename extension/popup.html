<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dion Jingles</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 300px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    h1 {
      font-size: 20px;
      margin-bottom: 20px;
      text-align: center;
      font-weight: 600;
    }

    .sound-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sound-button {
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.2);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 8px;
      color: white;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .sound-button:hover {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-2px);
    }

    .sound-button:active {
      transform: translateY(0);
    }

    .sound-button .icon {
      font-size: 18px;
    }

    .status {
      margin-top: 15px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      font-size: 12px;
      text-align: center;
      opacity: 0.8;
    }

    .status.active {
      opacity: 1;
      background: rgba(76, 175, 80, 0.3);
    }

    .status.warning {
      opacity: 1;
      background: rgba(255, 152, 0, 0.45);
      font-weight: bold;
    }

    .webrtc-toggle {
      margin-top: 15px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s;
    }

    .webrtc-toggle:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .webrtc-toggle-label {
      font-size: 13px;
      font-weight: 500;
    }

    .webrtc-toggle-switch {
      width: 44px;
      height: 24px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      position: relative;
      transition: background 0.2s;
    }

    .webrtc-toggle-switch.active {
      background: rgba(76, 175, 80, 0.8);
    }

    .webrtc-toggle-switch::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: transform 0.2s;
    }

    .webrtc-toggle-switch.active::after {
      transform: translateX(20px);
    }

    .webrtc-info {
      margin-top: 8px;
      font-size: 11px;
      opacity: 0.7;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>🎵 Dion Jingles</h1>
  
  <div class="sound-buttons">
    <button class="sound-button" data-sound="applause">
      <span>👏 Аплодисменты</span>
      <span class="icon">▶</span>
    </button>
    
    <button class="sound-button" data-sound="success">
      <span>✅ Успех</span>
      <span class="icon">▶</span>
    </button>
    
    <button class="sound-button" data-sound="error">
      <span>❌ Ошибка</span>
      <span class="icon">▶</span>
    </button>
    
    <button class="sound-button" data-sound="notification">
      <span>🔔 Уведомление</span>
      <span class="icon">▶</span>
    </button>
  </div>

  <div class="webrtc-toggle" id="webrtcToggle">
    <span class="webrtc-toggle-label">📡 Встраивание в WebRTC</span>
    <div class="webrtc-toggle-switch active" id="webrtcSwitch"></div>
  </div>
  <div class="webrtc-info" id="webrtcInfo">Звуки будут слышны другим участникам</div>

  <div class="status" id="status">Готов к использованию</div>

  <script src="popup.js"></script>
</body>
</html>
